<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KTN POS">
<meta name="theme-color" content="#0B4337">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}img{max-width:100%}</style>
<title>KTN POS ร้านอาหาร</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Bai+Jamjuree:wght@600;700&display=swap">
<style>
/* Layout: nav rail | menu grid | cart panel (iPad landscape); stacks to bottom bar + cart sheet on narrow screens */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --sunk:#E3E9E5; --ink:#15231E; --muted:#5B6B64; --line:#D5DDD8;
  --brand:#0F5A48; --brand-2:#0B4337; --brand-ink:#FFFFFF; --brand-soft:#DCEDE6;
  --accent:#E3A21A; --accent-ink:#2B1C00; --accent-soft:#FBEFD2;
  --danger:#B93A27; --danger-soft:#F8E1DC; --ok:#2C8A5A; --warn:#C27F06;
  --f-ui:"Anuphan","Sukhumvit Set","Thonburi","Noto Sans Thai",system-ui,sans-serif;
  --f-display:"Bai Jamjuree","Anuphan","Thonburi",system-ui,sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(10,30,25,.06),0 4px 14px rgba(10,30,25,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#151F1C; --sunk:#1C2824; --ink:#E4ECE8; --muted:#93A39C; --line:#26342F;
  --brand:#3BAE8B; --brand-2:#0A1A15; --brand-ink:#04140E; --brand-soft:#173A30;
  --accent:#F0B43C; --accent-ink:#241700; --accent-soft:#3A2D10;
  --danger:#E26A55; --danger-soft:#3B1E18; --ok:#4FC28A; --warn:#E9A93A; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#151F1C; --sunk:#1C2824; --ink:#E4ECE8; --muted:#93A39C; --line:#26342F;
  --brand:#3BAE8B; --brand-2:#0A1A15; --brand-ink:#04140E; --brand-soft:#173A30;
  --accent:#F0B43C; --accent-ink:#241700; --accent-soft:#3A2D10;
  --danger:#E26A55; --danger-soft:#3B1E18; --ok:#4FC28A; --warn:#E9A93A; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{height:100%}
body{height:var(--appH,100%);width:var(--appW,auto);overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-ui);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.2}

.app{display:grid;grid-template-columns:84px minmax(0,1fr);height:100%}
.rail{background:var(--brand-2);color:rgba(255,255,255,.78);display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:12px 8px;padding-left:max(8px,env(safe-area-inset-left,0px))}
.rail .logo{font-family:var(--f-display);font-weight:700;color:#fff;text-align:center;font-size:15px;line-height:1.05;padding:6px 0 14px;letter-spacing:.02em}
.rail .logo small{display:block;color:var(--accent);font-size:11px;letter-spacing:.12em}
.nav{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;font-size:12.5px;font-weight:500;color:inherit;position:relative}
.nav svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav.on{background:rgba(255,255,255,.1);color:#fff}
.nav.on::before{content:"";position:absolute;left:-8px;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--accent)}
.nav .badge{position:absolute;top:4px;right:10px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;border-radius:9px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}
.rail .spacer{flex:1}
.sync{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;text-align:center;padding:8px 2px;border-radius:10px;color:rgba(255,255,255,.78)}
.sync .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(79,194,138,.25)}
.sync.off .dot{background:var(--accent);box-shadow:0 0 0 3px rgba(240,180,60,.25)}

main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.vendor{font-size:11.5px;color:var(--muted);text-align:center;padding:5px 16px calc(5px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);letter-spacing:.02em}
.vendor b{color:var(--ink);font-weight:600}

/* ---------- SELL ---------- */
.sell{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px}
.menu-pane{display:flex;flex-direction:column;min-height:0;min-width:0}
.topbar{display:flex;gap:10px;align-items:center;padding:12px 16px 8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:4px;gap:2px}
.seg button{padding:9px 16px;border-radius:9px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.search{flex:1;min-width:140px;position:relative}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px 0 40px}
.search svg{position:absolute;left:12px;top:12px;width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 16px;border-radius:12px;font-weight:600;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.btn.sm{height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.btn.accent{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .count{background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:0 6px;font-size:12px;line-height:18px}
.cats{display:flex;gap:8px;padding:4px 16px 10px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 16px;border-radius:19px;background:var(--surface);border:1px solid var(--line);font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.grid{flex:1;overflow:auto;padding:0 16px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:10px;align-content:start}
.item{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;overflow:hidden;min-height:128px;position:relative;border:1px solid transparent;transition:transform .08s}
.item:active{transform:scale(.97)}
.item,.nav,.chip,.tbl,.line{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.item .ph{height:74px;background:var(--hue,var(--brand-soft));display:flex;align-items:flex-end;padding:8px 10px;font-weight:600;font-size:12px;letter-spacing:.04em;color:rgba(0,0,0,.45);background-size:cover;background-position:center}
.item .ph.pic{height:auto;aspect-ratio:1/1;padding:0;background:var(--sunk);overflow:hidden}
.item .ph.pic img{width:100%;height:100%;object-fit:cover;display:block}
.item .meta{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.item .nm{font-weight:600;line-height:1.25;font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .pr{margin-top:auto;font-weight:700;color:var(--brand);font-size:15px}
.item .qty{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:14px;min-width:28px;height:28px;line-height:28px;text-align:center;padding:0 6px;box-shadow:var(--shadow)}
.item.out{opacity:.5}
.item.out::after{content:"หมด";position:absolute;top:8px;left:8px;background:var(--danger);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px}
.empty{color:var(--muted);text-align:center;padding:40px 16px;grid-column:1/-1}

.cart{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.cart-head{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.cart-head .ctx{flex:1;min-width:0}
.cart-head .ctx h2{font-size:20px}
.cart-head .ctx div{color:var(--muted);font-size:13px}
.lines{flex:1;overflow:auto;padding:6px 8px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 8px;border-radius:10px;text-align:left;width:100%}
.line:active{background:var(--sunk)}
.line .ln{font-weight:600}
.line .lo{color:var(--muted);font-size:13px;grid-column:1}
.line .lq{grid-row:1/3;grid-column:2;display:flex;align-items:center;gap:6px}
.stepper{display:inline-flex;align-items:center;background:var(--sunk);border-radius:10px}
.stepper button{width:38px;height:38px;font-size:20px;font-weight:600;color:var(--brand)}
.stepper span{min-width:26px;text-align:center;font-weight:700}
.line .lt{min-width:62px;text-align:right;font-weight:600}
.cart-empty{color:var(--muted);text-align:center;padding:40px 20px;display:flex;flex-direction:column;gap:6px;align-items:center}
.cart-empty svg{width:48px;height:48px;stroke:var(--line);fill:none;stroke-width:1.5}
.totals{border-top:1px solid var(--line);padding:10px 16px;display:grid;gap:4px}
.trow{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
.trow button{color:var(--brand);font-weight:600}
.trow.grand{color:var(--ink);font-size:16px;font-weight:600;align-items:baseline;padding-top:4px}
.trow.grand .num{font-family:var(--f-display);font-size:30px;font-weight:700}
.cart-actions{display:grid;grid-template-columns:auto 1fr;gap:8px;padding:0 16px 14px}
.paybtn{height:60px;border-radius:14px;background:var(--brand);color:var(--brand-ink);font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.paybtn:disabled{opacity:.4}
.cart-actions .btn{height:60px}
.cart-toggle{display:none}

/* ---------- TABLES ---------- */
.pagehead{display:flex;align-items:center;gap:12px;padding:16px 16px 8px;flex-wrap:wrap}
.pagehead h1{font-size:24px;flex:1;min-width:160px}
.legend{display:flex;gap:14px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.zone-tabs{display:flex;gap:8px;padding:0 16px 10px;overflow-x:auto}
.plan-wrap{flex:1;min-height:0;overflow:auto;padding:0 16px 16px}
.plan{position:relative;width:100%;max-width:1200px;aspect-ratio:16/10;margin:0 auto;background-color:var(--surface);background-image:radial-gradient(var(--line) 1.2px,transparent 1.3px);background-size:24px 24px;border-radius:16px;border:1px solid var(--line);overflow:hidden;touch-action:none}
.tbl{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:12px;background:var(--sunk);border:2px solid var(--line);text-align:center;padding:4px;overflow:hidden;font-size:12px;color:var(--muted)}
.tbl.round{border-radius:50%}
.tbl .tn{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--ink);line-height:1}
.tbl.busy{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.tbl.busy .tn{color:var(--brand-ink)}
.tbl.long{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tbl.long .tn{color:var(--accent-ink)}
.tbl.sel{outline:3px solid var(--accent);outline-offset:2px}
.edit .tbl{cursor:grab;background:var(--brand-soft);border-color:var(--brand);border-style:dashed;color:var(--ink)}
.tbl .rz{position:absolute;right:0;bottom:0;width:22px;height:22px;background:linear-gradient(135deg,transparent 50%,var(--brand) 50%);border-radius:0 0 10px 0}
.tbl.round .rz{border-radius:0}
.deco{position:absolute;border-radius:8px;background:repeating-linear-gradient(45deg,var(--sunk),var(--sunk) 6px,transparent 6px,transparent 12px);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);font-weight:600}
.edit .deco{cursor:grab;border-style:dashed;border-color:var(--muted)}

@supports not (aspect-ratio:1){.plan{height:0;padding-bottom:62.5%}}
/* ---------- REPORTS / SETTINGS ---------- */
.scroll{flex:1;overflow:auto;padding:0 16px 24px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .k{color:var(--muted);font-size:13px}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.15}
.kpi .s{color:var(--muted);font-size:12.5px}
.kpi.hl{background:var(--brand);color:var(--brand-ink)}
.kpi.hl .k,.kpi.hl .s{color:inherit;opacity:.8}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.panel{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.panel h3{font-size:16px;margin-bottom:10px}
.bars{display:grid;gap:10px}
.bar .bl{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;gap:8px}
.bar .bt{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.bar .bf{height:100%;background:var(--brand);border-radius:5px}
.bar.tct .bf{background:var(--accent)}
.tbl-wrap{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:14px}
table.data th{text-align:left;color:var(--muted);font-weight:500;font-size:12.5px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.data td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.data td.r,table.data th.r{text-align:right}
table.data tr.void td{color:var(--muted);text-decoration:line-through}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:8px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--brand-soft);color:var(--brand)}
.pill.warn{background:var(--accent-soft);color:var(--warn)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.tabs{display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto}
.form{display:grid;gap:14px;max-width:760px}
.field{display:grid;gap:6px}
.field label,.lbl{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px;width:100%}
.field textarea{height:auto;min-height:80px;padding:10px 12px;resize:vertical}
.field .hint{font-size:12.5px;color:var(--muted)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.toggle .tt{display:flex;flex-direction:column}
.toggle .tt small{color:var(--muted)}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--line);border-radius:15px;transition:.15s}
.sw span::after{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw input:checked+span{background:var(--brand)}
.sw input:checked+span::after{transform:translateX(22px)}
.mlist{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px 8px 8px;text-align:left;width:100%}
.mrow .th{width:52px;height:52px;border-radius:10px;background:var(--hue,var(--brand-soft));background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;color:rgba(0,0,0,.3);font-size:20px}
.mrow .mi{min-width:0}
.mrow .mi b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .mi small{color:var(--muted)}
.mrow .mp{text-align:right}
.mrow .mp b{display:block}
.mrow .mp small{color:var(--muted)}
.sect{display:flex;align-items:center;gap:10px;margin:18px 0 8px}
.sect h3{font-size:15px;flex:1}
.note{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px}
.note.info{background:var(--brand-soft)}
.editor-side{display:grid;gap:10px;align-content:start}
.plan-editor{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px;align-items:start}

/* ---------- MODAL ---------- */
.modal-bg{position:fixed;top:0;left:0;width:var(--appW,100%);height:var(--appH,100%);background:rgba(8,20,16,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.modal{background:var(--surface);border-radius:18px;width:min(520px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.modal.wide{width:min(980px,100%)}
.modal.full{width:100%;height:100%;max-width:1180px}
.mh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.mh h2{flex:1;font-size:20px}
.mb{padding:16px 18px;overflow:auto;flex:1;min-height:0}
.mf{display:flex;gap:10px;padding:12px 18px 16px;border-top:1px solid var(--line);justify-content:flex-end;flex-wrap:wrap}
.x{width:40px;height:40px;border-radius:10px;background:var(--sunk);font-size:22px;line-height:40px;color:var(--muted)}
.optgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.opt{border:1.5px solid var(--line);border-radius:12px;padding:12px;text-align:left;display:flex;justify-content:space-between;gap:8px;font-weight:500}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.qtybig{display:flex;align-items:center;gap:16px;justify-content:center;margin:14px 0}
.qtybig .stepper button{width:56px;height:56px;font-size:28px}
.qtybig .stepper span{min-width:50px;font-size:24px}

/* payment */
.pay{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);flex:1;min-height:0}
.pay-left{background:var(--sunk);padding:18px;min-height:0;display:flex;flex-direction:column;gap:12px;overflow:auto}
.due{background:var(--brand);color:var(--brand-ink);border-radius:16px;padding:16px 18px}
.due .k{opacity:.8;font-size:14px}
.due .v{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1.05}
.tender{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border-radius:12px;padding:10px 12px;gap:8px}
.tender small{color:var(--muted);display:block}
.pay-right{padding:18px;display:flex;flex-direction:column;gap:14px;overflow:auto;min-width:0;min-height:0;-webkit-overflow-scrolling:touch}
@media (max-height:820px){.pay-right,.pay-left{padding:12px;gap:10px}.amount-show{font-size:32px;padding:2px 14px}.due .v{font-size:36px}.method{min-height:58px;padding:8px 10px}.paybtn{height:52px}.mh{padding:10px 16px}}

/* ================= calculations ================= */
function lineUnit(l){return r2(l.price+(l.opts||[]).reduce((a,o)=>a+(+o.price||0),0))}
function calc(b,s){
  s=s||S;const st=s.settings;
  const sub=r2(b.items.reduce((a,l)=>a+lineUnit(l)*l.qty,0));
  let disc=0; if(b.disc){disc=b.disc.t==='pct'?sub*b.disc.v/100:b.disc.v;disc=Math.min(r2(disc),sub)}
  const mdisc=b.redeem&&s.settings.member&&s.settings.member.on?Math.min(r2(Math.floor(b.redeem/(s.settings.member.redeemPts||1))*(s.settings.member.redeemBaht||0)),r2(sub-disc)):0;
  const after=r2(sub-disc-mdisc);
  const svc=st.service.on&&b.type==='dine'?r2(after*st.service.rate/100):0;
  const base=r2(after+svc);
  let vat=0,total=base;
  if(st.vat.mode==='ex'){vat=r2(base*st.vat.rate/100);total=r2(base+vat)}
  else if(st.vat.mode==='in'){vat=r2(base-base/(1+st.vat.rate/100))}
  const cost=r2(b.items.reduce((a,l)=>a+(+l.cost||0)*l.qty,0));
  const qty=b.items.reduce((a,l)=>a+l.qty,0);
  return {sub,disc,mdisc,svc,vat,total,cost,qty};
}
function nextSeq(field,s){s=s||S;const d=dkey();if(s[field].d!==d){s[field].d=d;s[field].n=0}return ++s[field].n}
function makeOrder(bill,c,tenders,cash,t,s,demo){
  s=s||S;const d=new Date(t||Date.now());
  const no=nextSeq('seq',s);
  const tbl=bill.tableId&&s.tables.find(x=>x.id===bill.tableId);
  return {id:s.settings.device+'-'+uid(),no:String(d.getFullYear()%100).padStart(2,'0')+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+String(no).padStart(3,'0'),
    type:bill.type,table:tbl?tbl.name:'',queue:bill.type!=='dine'?nextSeq('q',s):null,channel:bill.channel||'',
    items:bill.items.map(l=>({name:l.name,qty:l.qty,price:lineUnit(l),opts:(l.opts||[]).map(o=>o.name),note:l.note||'',cost:+l.cost||0,kfcId:(s.menu.find(m=>m.id===l.mid)||{}).kfcId||''})),
    branch:s.settings.branch||'',mdisc:c.mdisc||0,
    sub:c.sub,disc:c.disc,svc:c.svc,vat:c.vat,total:c.total,cost:c.cost,tenders,cash,
    openedAt:bill.openedAt,paidAt:d.getTime(),status:'paid',synced:false,device:s.settings.device,demo:!!demo,
    shiftId:s.shift?s.shift.id:null,cashier:(s.users.find(u=>s.session&&u.id===s.session.uid)||{name:demo?'พนักงาน 1':''}).name};
}

/* PromptPay EMVCo payload */
function tlv(id,v){return id+String(v.length).padStart(2,'0')+v}
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function ppPayload(id,amount){
  id=String(id).replace(/\D/g,'');
  let acc; if(id.length>=13&&id.length<15) acc=tlv('02',id); else if(id.length>=15) acc=tlv('03',id); else acc=tlv('01',('0000000000000'+('66'+id.replace(/^0/,''))).slice(-13));
  let p=tlv('00','01')+tlv('01',amount?'12':'11')+tlv('29',tlv('00','A000000677010111')+acc)+tlv('53','764')+(amount?tlv('54',r2(amount).toFixed(2)):'')+tlv('58','TH')+'6304';
  return p+crc16(p);
}
function drawPromptPay(cv,id,amt){
  try{
    if(typeof qrcode==='undefined') throw 0;
    const q=qrcode(0,'M');q.addData(ppPayload(id,amt));q.make();
    const n=q.getModuleCount(),m=4,sz=cv.width,cell=sz/(n+m*2),ctx=cv.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,sz,sz);ctx.fillStyle='#000';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(Math.floor((c+m)*cell),Math.floor((r+m)*cell),Math.ceil(cell),Math.ceil(cell));
  }catch(e){const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,240,240);ctx.fillStyle='#111';ctx.font='14px sans-serif';ctx.fillText('โหลดตัวสร้าง QR ไม่ได้',40,120)}
}

function bindPlanDrag(plan){
  let drag=null;
  plan.addEventListener('pointerdown',e=>{
    const el=e.target.closest('[data-pid]');if(!el)return;
    const id=el.dataset.pid,obj=S.tables.find(x=>x.id===id)||S.decos.find(x=>x.id===id);
    const r=plan.getBoundingClientRect();
    drag={el,obj,rz:!!e.target.dataset.rz,sx:e.clientX,sy:e.clientY,ox:obj.x,oy:obj.y,ow:obj.w,oh:obj.h,W:r.width,H:r.height,moved:false};
    el.setPointerCapture(e.pointerId);e.preventDefault();
  });
  plan.addEventListener('pointermove',e=>{
    if(!drag)return;const dx=(e.clientX-drag.sx)/drag.W*100,dy=(e.clientY-drag.sy)/drag.H*100;
    if(Math.abs(dx)+Math.abs(dy)>.6)drag.moved=true;
    const o=drag.obj,snap=v=>Math.round(v);
    if(drag.rz){o.w=Math.max(6,Math.min(100-o.x,snap(drag.ow+dx)));o.h=Math.max(8,Math.min(100-o.y,snap(drag.oh+dy)))}
    else{o.x=Math.max(0,Math.min(100-o.w,snap(drag.ox+dx)));o.y=Math.max(0,Math.min(100-o.h,snap(drag.oy+dy)))}
    Object.assign(drag.el.style,{left:o.x+'%',top:o.y+'%',width:o.w+'%',height:o.h+'%'});
  });
  const end=()=>{if(!drag)return;const d=drag;drag=null;if(!d.moved){selTbl=d.obj.id}save();setPlan()};
  plan.addEventListener('pointerup',end);plan.addEventListener('pointercancel',end);
}

async function api(method,params,body){
  const url=S.settings.gasUrl.trim(); if(!url) throw new Error('ยังไม่ได้ใส่ลิงก์ Web App ใน ตั้งค่า › เชื่อมต่อ');
  if(!navigator.onLine) throw new Error('ตอนนี้ออฟไลน์อยู่');
  let r;
  if(method==='GET') r=await fetch(url+(url.includes('?')?'&':'?')+new URLSearchParams(params));
  else r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  const j=await r.json(); if(j.error) throw new Error(j.error); return j;
}

function shrinkImg(src,max){return new Promise(res=>{if(!/^data:image/.test(src)){res(src);return}const img=new Image();img.onload=()=>{try{
  const W=img.width,H=img.height,c0=document.createElement('canvas');c0.width=W;c0.height=H;const x0=c0.getContext('2d');x0.drawImage(img,0,0);
  let d=null;try{d=x0.getImageData(0,0,W,H).data}catch(e){}
  let L=0,T=0,R=W-1,B=H-1;
  if(d){const bg=(i)=>d[i+3]<20||(d[i]>245&&d[i+1]>245&&d[i+2]>245);const col=xx=>{for(let y=0;y<H;y+=2)if(!bg((y*W+xx)*4))return false;return true};const row=yy=>{for(let xx=0;xx<W;xx+=2)if(!bg((yy*W+xx)*4))return false;return true};
    while(L<R&&col(L))L++;while(R>L&&col(R))R--;while(T<B&&row(T))T++;while(B>T&&row(B))B--;}
  const cw=R-L+1,ch=B-T+1;const sc=Math.min(1,max/Math.max(cw,ch));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(cw*sc));c.height=Math.max(1,Math.round(ch*sc));
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,L,T,cw,ch,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.75))}catch(e){res(src)}};img.onerror=()=>res('');img.src=src})}

let pinBuf='',pinCb=null,pinMin='manager',pinTitle='';
function askPin(cb,min,title){pinBuf='';pinCb=cb;pinMin=min||'manager';pinTitle=title||'';drawPin()}
function dots(n){return `<div class="pindots">${Array.from({length:Math.max(4,n)},(_,i)=>`<i class="${i<n?'f':''}"></i>`).join('')}</div>`}
function padHTML(act){return `<div class="pinpad">${['1','2','3','4','5','6','7','8','9','C','0','⌫'].map(k=>`<button data-a="${act}" data-k="${k}">${k}</button>`).join('')}</div>`}
function drawPin(msg){modal(mh('ใส่ PIN '+ROLE_TH[pinMin]+(pinMin!=='owner'?'หรือเจ้าของ':''))+`<div class="mb">${pinTitle?`<p class="lbl" style="text-align:center;margin:0 0 12px">เพื่อ${esc(pinTitle)}</p>`:''}${dots(pinBuf.length)}<p style="text-align:center;color:var(--danger);min-height:22px;margin:8px 0 0">${msg||''}</p>${padHTML('pinKey')}</div>`)}
function pinMax(){return Math.max(4,...S.users.map(u=>String(u.pin).length))}
function pinStep(buf,k){if(k==='⌫')return buf.slice(0,-1);if(k==='C')return '';return buf.length<6?buf+k:buf}
A.pinKey=el=>{pinBuf=pinStep(pinBuf,el.dataset.k);
  const u=S.users.find(x=>x.pin===pinBuf);
  if(u){if(RANK[u.role]>=RANK[pinMin]){const cb=pinCb;closeModal();cb&&cb(u);return}pinBuf='';return drawPin('PIN นี้ไม่มีสิทธิ์ทำรายการนี้')}
  if(pinBuf.length>=pinMax()||(pinBuf.length>=4&&!S.users.some(x=>x.pin.length>pinBuf.length))){pinBuf='';return drawPin('PIN ไม่ถูกต้อง')}
  drawPin()};

A.userNew=()=>userForm(null);

A.userSave=el=>{const id=el.dataset.id,name=$('#u_name').value.trim(),role=$('#u_role').value,pin=$('#u_pin').value.trim();
  if(!name)return toast('ใส่ชื่อก่อน');if(!/^\d{4,6}$/.test(pin))return toast('PIN ต้องเป็นตัวเลข 4–6 หลัก');
  if(S.users.some(u=>u.id!==id&&(u.pin===pin||u.pin.startsWith(pin)||pin.startsWith(u.pin))))return toast('PIN ซ้ำหรือขึ้นต้นเหมือนของคนอื่น ใช้ PIN อื่น');

A.userDel=el=>{const u=S.users.find(x=>x.id===el.dataset.id);
  if(u.role==='owner'&&S.users.filter(x=>x.role==='owner').length===1)return toast('ต้องมีเจ้าของอย่างน้อย 1 คน');
  if(S.session&&S.session.uid===u.id)return toast('ลบผู้ใช้ที่กำลังใช้งานอยู่ไม่ได้');
  S.users=S.users.filter(x=>x!==u);saveNow();closeModal();setUsers()};

/* ================= SHIFTS ================= */
const DENOMS=[1000,500,100,50,20,10,5,2,1,0.5,0.25];
function shiftNo(id){if(S.shift&&S.shift.id===id)return S.shift.no;const x=S.shifts.find(s=>s.id===id);return x?x.no:''}
function shiftSummary(sh){
  const os=S.orders.filter(o=>o.shiftId===sh.id);const paid=os.filter(o=>o.status==='paid'),voids=os.filter(o=>o.status==='void');
  const byPay={};let gov=0,cust=0,cashSales=0;
  paid.forEach(o=>o.tenders.forEach(t=>{byPay[t.name]=byPay[t.name]||{v:0,n:0};byPay[t.name].v+=t.amount;byPay[t.name].n++;
    if(t.type==='tct'){gov+=t.gov||0;cust+=t.cust||0}if(t.type==='cash')cashSales+=t.amount}));
  const byType={dine:0,take:0,delivery:0};paid.forEach(o=>byType[o.type]+=o.total);
  const moves=sh.moves||[];const cin=moves.filter(m=>m.type==='in').reduce((a,m)=>a+m.amount,0),cout=moves.filter(m=>m.type==='out').reduce((a,m)=>a+m.amount,0);
  const items={};paid.forEach(o=>o.items.forEach(i=>{items[i.name]=(items[i.name]||0)+i.qty}));
  return {sales:r2(paid.reduce((a,o)=>a+o.total,0)),bills:paid.length,cost:r2(paid.reduce((a,o)=>a+o.cost,0)),disc:r2(paid.reduce((a,o)=>a+o.disc,0)),
    voids:voids.length,voidAmt:r2(voids.reduce((a,o)=>a+o.total,0)),byPay,gov:r2(gov),cust:r2(cust),cashSales:r2(cashSales),cin:r2(cin),cout:r2(cout),
    expected:r2((+sh.float||0)+cashSales+cin-cout),byType,top:Object.entries(items).sort((a,b)=>b[1]-a[1]).slice(0,10)};
}
A.shiftOpen=()=>{if(S.shift)return A.shiftPanel();const u=me();const last=S.shifts[S.shifts.length-1];
  const def=S.settings.defaultFloat||0;
  modal(mh('เปิดกะ')+`<div class="mb"><div class="form">
    <div class="note info">ผู้เปิดกะ: <b>${esc(u?u.name:'')}</b> · เครื่อง ${esc(S.settings.device)} · ${dstr(Date.now())} ${tstr(Date.now())}</div>
    <div class="field"><label for="sf">เงินทอนตั้งต้นในลิ้นชัก (บาท)</label><input id="sf" type="number" inputmode="decimal" value="${def}" style="font-size:24px;font-weight:700;height:56px"></div>
    <div class="optgrid">${[...new Set([def,500,1000,2000].filter(v=>v>=0))].map(v=>`<button class="opt" data-a="sfq" data-v="${v}"><span class="num">฿${fmt(v)}</span></button>`).join('')}</div>
    ${last?`<p class="lbl" style="margin:0">กะก่อนหน้า #${last.no} ปิดโดย ${esc(last.closeBy||'')} นับเงินได้ ฿${fmt(last.counted||0)}</p>`:''}
  </div></div><div class="mf"><button class="btn" data-a="close">ยกเลิก</button><button class="btn primary" data-a="shiftOpenOk">เปิดกะ</button></div>`)};
A.sfq=el=>{$('#sf').value=el.dataset.v};
A.shiftOpenOk=()=>{const u=me();const f=+$('#sf').value||0;
  S.shiftSeq=(S.shiftSeq||0)+1;
  S.shift={id:S.settings.device+'-S'+uid(),no:S.shiftSeq,device:S.settings.device,openedAt:Date.now(),openBy:u?u.name:'',openById:u?u.id:'',float:f,moves:[],synced:false};
  saveNow();closeModal();render();syncSoon();toast('เปิดกะ #'+S.shift.no+' แล้ว เงินทอน ฿'+fmt(f))};
A.shiftPanel=()=>{const sh=S.shift;if(!sh)return A.shiftOpen();const sm=shiftSummary(sh);
  modal(mh(`กะ #${sh.no} · ${esc(sh.openBy)}`,`<span class="lbl">เปิด ${tstr(sh.openedAt)}</span>`)+`<div class="mb"><div class="form" style="max-width:none">
    <div class="kpis" style="margin:0"><div class="kpi hl"><div class="k">ยอดขายกะนี้</div><div class="v num">฿${fmt(sm.sales)}</div><div class="s">${sm.bills} บิล${sm.voids?' · ยกเลิก '+sm.voids:''}</div></div>
      <div class="kpi"><div class="k">เงินสดที่ควรมีในลิ้นชัก</div><div class="v num">฿${fmt(sm.expected)}</div><div class="s">ตั้งต้น ${fmt(sh.float)} + ขายเงินสด ${fmt(sm.cashSales)} + เข้า ${fmt(sm.cin)} − ออก ${fmt(sm.cout)}</div></div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-a="cashMove" data-t="in">+ เงินเข้าลิ้นชัก</button><button class="btn" data-a="cashMove" data-t="out">− เงินออกจากลิ้นชัก</button><button class="btn" data-a="shiftView" data-id="${sh.id}">ดูใบสรุปกะ</button></div>
    <div class="sect"><h3>เงินเข้า/ออกระหว่างกะ</h3></div>
    ${(sh.moves||[]).length?`<div class="tbl-wrap"><table class="data"><tbody>${sh.moves.map((m,i)=>`<tr><td class="num">${tstr(m.t)}</td><td>${m.type==='in'?'<span class="pill ok">เข้า</span>':'<span class="pill bad">ออก</span>'} ${esc(m.reason)}</td><td>${esc(m.by)}</td><td class="r num">${m.type==='in'?'+':'−'}${fmt(m.amount)}</td><td><button class="btn sm ghost" data-a="moveDel" data-i="${i}">ลบ</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="lbl" style="margin:0">ยังไม่มีรายการ</p>'}
  </div></div><div class="mf"><button class="btn" data-a="close">ปิดหน้าต่าง</button><button class="btn accent" data-a="shiftClose">ปิดกะ & นับเงิน</button></div>`,'wide')};
A.cashMove=el=>{const t=el.dataset.t;const reasons=t==='out'?['ค่าน้ำแข็ง','ซื้อวัตถุดิบ','ค่าแก๊ส','นำเงินไปฝาก','เบิกเงินพนักงาน','อื่น ๆ']:['แลกเหรียญ/แบงก์ย่อย','เติมเงินทอน','อื่น ๆ'];
  modal(mh(t==='out'?'เงินออกจากลิ้นชัก':'เงินเข้าลิ้นชัก')+`<div class="mb"><div class="form">
    <div class="field"><label for="cm_amt">จำนวนเงิน (บาท)</label><input id="cm_amt" type="number" inputmode="decimal" style="font-size:24px;font-weight:700;height:56px"></div>
    <div class="optgrid">${reasons.map(r=>`<button class="opt" data-a="cmr" data-r="${esc(r)}">${esc(r)}</button>`).join('')}</div>
    <div class="field"><label for="cm_r">รายละเอียด</label><input id="cm_r" placeholder="เช่น ค่าน้ำแข็ง 2 กระสอบ"></div>
  </div></div><div class="mf"><button class="btn" data-a="shiftPanel">ย้อนกลับ</button><button class="btn primary" data-a="cashMoveOk" data-t="${t}">บันทึก</button></div>`)};
A.cmr=el=>{$('#cm_r').value=el.dataset.r;document.querySelectorAll('[data-a="cmr"]').forEach(b=>b.classList.toggle('on',b===el))};
A.cashMoveOk=el=>{const amt=r2(+$('#cm_amt').value);if(!(amt>0))return toast('ใส่จำนวนเงินก่อน');const u=me();
  S.shift.moves.push({t:Date.now(),type:el.dataset.t,amount:amt,reason:$('#cm_r').value.trim()||(el.dataset.t==='out'?'เงินออก':'เงินเข้า'),by:u?u.name:''});
  S.shift.synced=false;saveNow();A.shiftPanel();toast('บันทึกแล้ว')};
A.moveDel=el=>{const doit=()=>{S.shift.moves.splice(+el.dataset.i,1);S.shift.synced=false;saveNow();A.shiftPanel()};if(can('manager'))doit();else askPin(doit,'manager','ลบรายการเงินเข้าออก')};
let countDraft=null;
A.shiftClose=()=>{const sh=S.shift;const sm=shiftSummary(sh);
  const open=Object.values(S.bills).filter(b=>b.items.length);
  countDraft=countDraft&&countDraft.id===sh.id?countDraft:{id:sh.id,c:{}};
  const drawCount=()=>{const tot=r2(DENOMS.reduce((a,d)=>a+d*(+countDraft.c[d]||0),0));const diff=r2(tot-sm.expected);
    const box=$('#cmpBox');if(box)box.innerHTML=cmpHTML(sm.expected,tot,diff);
    DENOMS.forEach(d=>{const e=$('#dsum_'+String(d).replace('.','_'));if(e)e.textContent=fmt(d*(+countDraft.c[d]||0))})};
  modal(mh(`ปิดกะ #${sh.no} · นับเงินในลิ้นชัก`)+`<div class="mb"><div class="form" style="max-width:none">
    ${open.length?`<div class="note">ยังมีบิลค้าง ${open.length} บิล (โต๊ะ/พักบิล) บิลเหล่านี้จะยังอยู่และไปนับในกะถัดไปเมื่อชำระ</div>`:''}
    <div class="denoms">${DENOMS.map(d=>`<label class="denom"><b>${d<1?(d*100)+' สต.':fmt(d)}</b><input type="number" inputmode="numeric" min="0" data-den="${d}" value="${countDraft.c[d]||''}" placeholder="0" aria-label="จำนวน ${d}"><span class="num" id="dsum_${String(d).replace('.','_')}">0</span></label>`).join('')}</div>
    <div id="cmpBox"></div>
    <div class="field"><label for="cl_note">หมายเหตุ (ถ้าเงินขาด/เกิน ให้ระบุเหตุผล)</label><input id="cl_note"></div>
  </div></div><div class="mf"><button class="btn" data-a="shiftPanel">ย้อนกลับ</button><button class="btn accent" data-a="shiftCloseOk">ยืนยันปิดกะ</button></div>`,'wide');
  document.querySelectorAll('[data-den]').forEach(i=>i.addEventListener('input',()=>{countDraft.c[i.dataset.den]=+i.value||0;drawCount()}));
  drawCount()};
function cmpHTML(exp,tot,diff){return `<div class="cmp"><div><small>เงินสดที่ควรมี</small><span class="num">฿${fmt(exp)}</span></div><div><small>นับได้จริง</small><span class="num">฿${fmt(tot)}</span></div>
  <div class="${diff<0?'short':diff>0?'over':'even'}"><small>${diff<0?'เงินขาด':diff>0?'เงินเกิน':'ตรงยอด'}</small><span class="num">${diff?'฿'+fmt(Math.abs(diff)):'✓'}</span></div></div>`}
A.shiftCloseOk=()=>{const sh=S.shift;const sm=shiftSummary(sh);const u=me();
  const tot=r2(DENOMS.reduce((a,d)=>a+d*(+countDraft.c[d]||0),0));
  Object.assign(sh,{closedAt:Date.now(),closeBy:u?u.name:'',closeById:u?u.id:'',counted:tot,denoms:countDraft.c,diff:r2(tot-sm.expected),note:$('#cl_note').value.trim(),summary:sm,synced:false});
  S.shifts.push(sh);S.shift=null;countDraft=null;saveNow();showShift(sh);render();syncSoon()};
function shiftHTML(sh){const sm=sh.summary||shiftSummary(sh);const st=S.settings;
  const diff=sh.closedAt?sh.diff:null;
  return `<div class="receipt">
    <div class="c big">สรุปกะ #${sh.no}</div><div class="c">${esc(st.shopName)} ${esc(st.branch)}<br>เครื่อง ${esc(sh.device||st.device)}</div><hr>
    <div class="rr"><span>เปิดกะ</span><span>${dstr(sh.openedAt)} ${tstr(sh.openedAt)}</span></div><div class="rr"><span>โดย</span><span>${esc(sh.openBy)}</span></div>
    ${sh.closedAt?`<div class="rr"><span>ปิดกะ</span><span>${dstr(sh.closedAt)} ${tstr(sh.closedAt)}</span></div><div class="rr"><span>โดย</span><span>${esc(sh.closeBy)}</span></div>`:'<div class="c">(ยังไม่ปิดกะ)</div>'}
    <hr><div class="rr big"><span>ยอดขาย</span><span>${fmt2(sm.sales)}</span></div>
    <div class="rr"><span>จำนวนบิล</span><span>${sm.bills}</span></div><div class="rr"><span>ส่วนลดรวม</span><span>${fmt2(sm.disc)}</span></div>
    <div class="rr"><span>บิลยกเลิก</span><span>${sm.voids} บิล (${fmt2(sm.voidAmt)})</span></div>
    <hr><b>แยกตามช่องทางชำระ</b>
    ${Object.entries(sm.byPay).map(([k,x])=>`<div class="rr"><span>${esc(k)} (${x.n})</span><span>${fmt2(x.v)}</span></div>`).join('')||'<div>-</div>'}
    ${sm.gov||sm.cust?`<div class="rr" style="padding-left:12px"><span>ไทยช่วยไทย-รัฐ</span><span>${fmt2(sm.gov)}</span></div><div class="rr" style="padding-left:12px"><span>ไทยช่วยไทย-ลูกค้า</span><span>${fmt2(sm.cust)}</span></div>`:''}
    <hr><b>แยกตามประเภท</b>${Object.entries(sm.byType).map(([k,v])=>`<div class="rr"><span>${TYPE_TH[k]}</span><span>${fmt2(v)}</span></div>`).join('')}

function hx(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return [n>>16&255,n>>8&255,n&255]}

function mixc(a,b,t){const x=hx(a),y=hx(b);return toHex(x.map((v,i)=>v+(y[i]-v)*t))}

  for(let i=0;i<(times||2);i++){const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=notes[i%3];g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.9,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.45);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.5);t+=.5}}catch(e){}}

function appBase(){
  const here=/^https?:/.test(location.protocol)&&!/claude|anthropic/.test(location.hostname)?location.href.replace(/[#?].*$/,'').replace(/[^/]*$/,''):'';
  let pub=(S.settings.publicUrl||'').trim().replace(/[#?].*$/,'').replace(/(index|order)\.html$/,'');
  if(pub&&!/^https?:\/\//.test(pub))pub='https://'+pub;
  // github.io project sites need the repo folder: https://user.github.io/<repo>/
  if(/\.github\.io\/?$/.test(pub))pub=here&&here.startsWith(pub.replace(/\/?$/,'/'))?here:pub.replace(/\/?$/,'/')+'ktn-pos/';
  return (here||pub||'').replace(/\/?$/,'/');
}

function qrDataUrl(text,size){try{const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),m=3,c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d'),cell=size/(n+m*2);
  x.fillStyle='#fff';x.fillRect(0,0,size,size);x.fillStyle='#000';for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect(Math.floor((k+m)*cell),Math.floor((r+m)*cell),Math.ceil(cell),Math.ceil(cell));return c.toDataURL()}catch(e){return ''}}

    <div class="row2">${F('ซื้อทุกกี่บาท ได้ 1 แต้ม','settings.member.earnPer',ms.earnPer,{type:'number'})}${F('ใช้กี่แต้ม','settings.member.redeemPts',ms.redeemPts,{type:'number'})}${F('แลกเป็นส่วนลดกี่บาท','settings.member.redeemBaht',ms.redeemBaht,{type:'number'})}</div>
    <div class="sect"><h3>สมาชิก (${S.members.length})</h3><input id="msearch" class="btn" style="font-weight:400;max-width:240px" placeholder="ค้นหาเบอร์/ชื่อ"></div>
    <div class="tbl-wrap"><table class="data"><thead><tr><th>เบอร์</th><th>ชื่อ</th><th class="r">แต้ม</th><th class="r">ซื้อสะสม</th><th class="r">ครั้ง</th><th></th></tr></thead><tbody id="mtb"></tbody></table></div></div>`;
  bindInputs($('#sbody'));
  const draw=()=>{const q=($('#msearch').value||'').trim();$('#mtb').innerHTML=S.members.filter(m=>!q||m.phone.includes(q)||(m.name||'').includes(q)).sort((a,b)=>b.total-a.total).slice(0,200).map(m=>`<tr><td class="num">${m.phone}</td><td>${esc(m.name||'')}</td><td class="r num">${m.points}</td><td class="r num">${fmt(m.total)}</td><td class="r num">${m.visits}</td><td><button class="btn sm" data-a="memberEdit" data-p="${m.phone}">แก้ไข</button></td></tr>`).join('')||'<tr><td colspan="6" class="lbl">ยังไม่มีสมาชิก</td></tr>'};
  $('#msearch').addEventListener('input',draw);draw()}
A.memberEdit=el=>{const m=findMember(el.dataset.p);modal(mh('แก้ไขสมาชิก '+m.phone)+`<div class="mb"><div class="form"><div class="field"><label for="me_n">ชื่อ</label><input id="me_n" value="${esc(m.name||'')}"></div><div class="field"><label for="me_p">แต้มคงเหลือ</label><input id="me_p" type="number" value="${m.points}"></div></div></div><div class="mf"><button class="btn" data-a="close">ยกเลิก</button><button class="btn primary" data-a="memberSave" data-p="${m.phone}">บันทึก</button></div>`)};
A.memberSave=el=>{const doit=()=>{const m=findMember(el.dataset.p);m.name=$('#me_n').value.trim();m.points=Math.max(0,Math.floor(+$('#me_p').value||0));m.updatedAt=Date.now();m.synced=false;saveNow();closeModal();setMembers()};
  if(can('manager'))doit();else askPin(doit,'manager','แก้แต้มสมาชิก')};
async function syncMembers(){if(!S.settings.gasUrl||!navigator.onLine)return;
  const pend=S.members.filter(m=>!m.synced);
  try{if(pend.length){const j=await api('POST',null,{action:'members',members:pend});const ok=new Set(j.saved||[]);pend.forEach(m=>{if(ok.has(m.phone))m.synced=true})}
    const g=await api('GET',{action:'members'});(g.members||[]).forEach(r=>{const m=findMember(r.phone);if(!m)S.members.push({...r,synced:true});else if(r.updatedAt>m.updatedAt&&m.synced)Object.assign(m,r,{synced:true})});saveNow()}catch(e){}}

/* ================= v3: STOCK (online) ================= */
let stockQ='',stockLow=false;
function renderStock(){const c=S.stockCache||{at:0,items:[]};
  $('#view').innerHTML=`<div class="pagehead"><h1>สต๊อกวัตถุดิบ</h1><span class="lbl">${c.at?'อัปเดต '+dstr(c.at)+' '+tstr(c.at):''}</span><button class="btn" data-a="stockLoad">โหลดล่าสุด</button></div>
  <div class="tabs"><div class="search" style="max-width:320px"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="sq" type="search" placeholder="ค้นหาวัตถุดิบ" value="${esc(stockQ)}"></div><button class="chip ${stockLow?'on':''}" data-a="stockLowT">เฉพาะใกล้หมด</button></div>
  <div class="scroll"><div class="panel"><div class="tbl-wrap"><table class="data"><thead><tr><th>วัตถุดิบ</th><th class="r">คงเหลือ</th><th class="r">ขั้นต่ำ</th><th>สถานะ</th><th></th></tr></thead><tbody id="stb"></tbody></table></div>
  <p class="lbl">ระบบตัดวัตถุดิบอัตโนมัติตามสูตรใน K-Food cost ทุกครั้งที่บิลซิงก์ขึ้น Sheet · กด “รับเข้า” เมื่อซื้อของ, “นับ” เพื่อปรับยอดให้ตรงของจริง</p></div></div>`;
  $('#sq').addEventListener('input',e=>{stockQ=e.target.value;drawStock()});drawStock();if(!c.at)A.stockLoad()}
function drawStock(){const c=S.stockCache||{items:[]};const q=norm(stockQ);
  const list=c.items.filter(i=>(!q||norm(i.name).includes(q))&&(!stockLow||(i.min>0&&i.bal<i.min)||i.bal<0)).sort((a,b)=>((b.min>0&&b.bal<b.min)-(a.min>0&&a.bal<a.min))||a.name.localeCompare(b.name,'th'));
  $('#stb').innerHTML=list.map(i=>{const low=i.min>0&&i.bal<i.min,neg=i.bal<0;return `<tr><td><b>${esc(i.name)}</b><br><small class="lbl">${esc(i.unit)}${i.buyQty?' · แพ็คละ '+fmt(i.buyQty)+' '+esc(i.unit):''}</small></td><td class="r num"><b>${fmt(i.bal)}</b></td><td class="r num">${i.min?fmt(i.min):'—'}</td>
    <td>${neg?'<span class="pill bad">ติดลบ ต้องนับ</span>':low?'<span class="pill warn">ใกล้หมด</span>':'<span class="pill ok">ปกติ</span>'}</td><td style="white-space:nowrap"><button class="btn sm" data-a="stockAct" data-t="in" data-id="${i.id}">รับเข้า</button> <button class="btn sm" data-a="stockAct" data-t="count" data-id="${i.id}">นับ</button> <button class="btn sm ghost" data-a="stockAct" data-t="min" data-id="${i.id}">ขั้นต่ำ</button></td></tr>`}).join('')||'<tr><td colspan="5" class="lbl">ไม่มีข้อมูล กด “โหลดล่าสุด” (ต้องออนไลน์และเชื่อม Sheet)</td></tr>'}
A.stockLowT=()=>{stockLow=!stockLow;renderStock()};
A.stockLoad=async()=>{try{toast('กำลังโหลดสต๊อก…');const j=await api('GET',{action:'stock'});S.stockCache={at:Date.now(),items:j.items||[]};saveNow();if(view==='stock')renderStock()}catch(e){toast('โหลดไม่สำเร็จ: '+e.message)}};
A.stockAct=el=>{const i=S.stockCache.items.find(x=>x.id===el.dataset.id);const t=el.dataset.t;const title={in:'รับเข้า',count:'นับสต๊อก (ใส่ยอดที่นับได้จริง)',min:'ตั้งจำนวนขั้นต่ำ (แจ้งเตือนเมื่อต่ำกว่า)'}[t];
  modal(mh(title+' · '+esc(i.name))+`<div class="mb"><div class="form">
    <div class="field"><label for="sa_q">จำนวน (${esc(i.unit)})</label><input id="sa_q" type="number" inputmode="decimal" style="font-size:22px;height:56px" value="${t==='count'?i.bal:t==='min'?i.min||'':''}"></div>
    ${t==='in'&&i.buyQty?`<div class="field"><label for="sa_p">หรือใส่จำนวนแพ็ค (แพ็คละ ${fmt(i.buyQty)} ${esc(i.unit)})</label><input id="sa_p" type="number" inputmode="decimal"></div>`:''}
    ${t!=='min'?'<div class="field"><label for="sa_n">หมายเหตุ</label><input id="sa_n" placeholder="เช่น ซื้อจากแมคโคร"></div>':''}
  </div></div><div class="mf"><button class="btn" data-a="close">ยกเลิก</button><button class="btn primary" data-a="stockSave" data-t="${t}" data-id="${i.id}">บันทึก</button></div>`);
  const p=$('#sa_p');if(p)p.addEventListener('input',()=>{$('#sa_q').value=r2((+p.value||0)*i.buyQty)})};
A.stockSave=async el=>{const t=el.dataset.t,id=el.dataset.id;const q=+$('#sa_q').value;if(isNaN(q))return toast('ใส่จำนวนก่อน');const u=me();
  const go=async()=>{try{await api('POST',null,{action:'stockAdj',id,type:t,qty:q,note:$('#sa_n')?$('#sa_n').value:'',by:u?u.name:''});closeModal();toast('บันทึกแล้ว');A.stockLoad()}catch(e){toast('บันทึกไม่สำเร็จ: '+e.message)}};
  if(t==='in'||can('manager'))go();else askPin(go,'manager','ปรับยอดสต๊อก')};

/* ================= v3: BRANCH REPORT ================= */
let brDays=7,brData=null;
async function renderBranch(){
  $('#view').innerHTML=`<div class="pagehead"><h1>รายงานยอดขาย</h1><div class="seg"><button data-a="repMode" data-m="day">รายวัน</button><button data-a="repMode" data-m="shift">รายกะ</button><button class="on" data-a="repMode" data-m="branch">ทุกสาขา</button></div>
    <div class="seg">${[7,30,90].map(d=>`<button class="${brDays===d?'on':''}" data-a="brDays" data-d="${d}">${d} วัน</button>`).join('')}</div></div><div class="scroll" id="brBody"><p class="lbl">กำลังโหลดจาก Google Sheet…</p></div>`;
  try{brData=await api('GET',{action:'summary',days:brDays});drawBranch()}catch(e){$('#brBody').innerHTML=`<div class="note">${esc(e.message)} — รายงานทุกสาขาต้องออนไลน์ และทุกสาขาต้องใช้ลิงก์ Web App เดียวกัน</div>`}}
function drawBranch(){const d=brData,bs=d.branches;const tot=bs.map(b=>({b,...d.totals[b]})).sort((x,y)=>y.sales-x.sales);const max=Math.max(1,...tot.map(x=>x.sales));const all=tot.reduce((a,x)=>a+x.sales,0);
  $('#brBody').innerHTML=`<div class="kpis"><div class="kpi hl"><div class="k">ยอดขายรวมทุกสาขา ${brDays} วัน</div><div class="v num">฿${fmt(all)}</div><div class="s">${tot.reduce((a,x)=>a+x.bills,0)} บิล · ${bs.length} สาขา</div></div>
    <div class="kpi"><div class="k">กำไรขั้นต้นรวม</div><div class="v num">฿${fmt(all-tot.reduce((a,x)=>a+x.cost,0))}</div></div><div class="kpi"><div class="k">ไทยช่วยไทย-รัฐ รวม</div><div class="v num">฿${fmt(tot.reduce((a,x)=>a+x.gov,0))}</div></div></div>
  <div class="cols"><div class="panel"><h3>เทียบสาขา</h3><div class="bars">${tot.map(x=>`<div class="bar"><div class="bl"><span>${esc(x.b)} <small class="pill">${x.bills} บิล</small></span><b class="num">฿${fmt(x.sales)}</b></div><div class="bt"><div class="bf" style="width:${x.sales/max*100}%"></div></div></div>`).join('')||'<span class="lbl">ยังไม่มีข้อมูล</span>'}</div></div>
  <div class="panel"><h3>แยกช่องทางชำระ</h3><div class="tbl-wrap"><table class="data"><thead><tr><th>สาขา</th><th class="r">เงินสด</th><th class="r">โอน/QR</th><th class="r">ไทยช่วยไทย</th><th class="r">อื่น ๆ</th></tr></thead><tbody>${tot.map(x=>`<tr><td>${esc(x.b)}</td><td class="r num">${fmt(x.cash)}</td><td class="r num">${fmt(x.qr)}</td><td class="r num">${fmt(x.gov+x.cust)}</td><td class="r num">${fmt(x.other)}</td></tr>`).join('')}</tbody></table></div></div></div>
  <div class="panel" style="margin-top:14px"><h3>รายวัน</h3><div class="tbl-wrap"><table class="data"><thead><tr><th>วันที่</th>${bs.map(b=>`<th class="r">${esc(b)}</th>`).join('')}<th class="r">รวม</th></tr></thead><tbody>${d.days.map(r=>`<tr><td class="num">${r.date}</td>${bs.map(b=>`<td class="r num">${r.by[b]?fmt(r.by[b]):'—'}</td>`).join('')}<td class="r num"><b>${fmt(Object.values(r.by).reduce((a,v)=>a+v,0))}</b></td></tr>`).join('')}</tbody></table></div></div>`}
A.brDays=el=>{brDays=+el.dataset.d;renderBranch()};

/* ================= v3: settings panels for kitchen/qr ================= */
function setFeatures(){const k=kset(),q=S.settings.qr||{};
  $('#sbody').innerHTML=`<div class="form">
    <div class="sect" style="margin-top:0"><h3>ส่งครัว</h3></div>
    ${T('ใช้ระบบส่งครัว','ปุ่ม “ส่งครัว” ส่งเฉพาะรายการใหม่ที่ยังไม่ได้ส่ง','settings.kitchen.on',k.on,true)}
    ${T('พิมพ์ใบสั่งครัว','พิมพ์ที่เครื่องพิมพ์ของเครื่องนี้','settings.kitchen.print',k.print)}
    ${T('ส่งขึ้นจอครัว (KDS)','จอ/แท็บเล็ตในครัวเปิดเมนู “ครัว” ดูออเดอร์ (ต้องออนไลน์)','settings.kitchen.kds',k.kds,true)}
    ${T('บิลกลับบ้าน/เดลิเวอรี ส่งครัวอัตโนมัติตอนชำระเงิน','','settings.kitchen.onPay',k.onPay)}
    ${T('ออเดอร์ QR ที่รับแล้ว ส่งครัวทันที','','settings.kitchen.qrAuto',k.qrAuto)}
    <div class="sect"><h3>QR สั่งอาหารที่โต๊ะ</h3></div>
    ${T('เปิดรับออเดอร์จากลูกค้าผ่าน QR','ลูกค้าสแกน QR ที่โต๊ะ สั่งเอง แล้ว POS มีเสียงเตือน (ต้องออนไลน์)','settings.qr.on',q.on,true)}
    ${F('ลิงก์หน้าเว็บของแอป (GitHub Pages)','settings.publicUrl',S.settings.publicUrl||'',{ph:'https://ktn2025.github.io/ktn-pos/',hint:'ใช้สร้างลิงก์ใน QR'})}
    ${T('เครื่องหลัก: ส่งเมนู/โต๊ะขึ้น Sheet อัตโนมัติ','เปิดไว้เครื่องเดียว เพื่อให้หน้า QR และเครื่องอื่นเห็นเมนูล่าสุด','settings.mainDevice',S.settings.mainDevice)}
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-a="qrTables">สร้าง/พิมพ์ QR ทุกโต๊ะ</button><button class="btn" data-a="pushNow">ส่งเมนูขึ้นตอนนี้</button></div>
    <div class="note">แจ้งเตือนเข้า LINE / Telegram (ปิดกะ, เงินขาด, ออเดอร์ QR, ของใกล้หมด, สรุปยอดรายวัน) ตั้งค่าใน Code.gs ฝั่ง Google — ดูคู่มือ</div>
  </div>`;
  bindInputs($('#sbody'))}
A.pushNow=async()=>{S.cfgHash='';const m=S.settings.mainDevice;S.settings.mainDevice=true;await autoPushCfg();S.settings.mainDevice=m;toast(S.cfgHash?'ส่งเมนูขึ้น Sheet แล้ว':'ส่งไม่สำเร็จ ตรวจการเชื่อมต่อ')};

/* events */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  const fn=A[el.dataset.a];if(fn){fn(el,e)}
});
// long-press menu item = open options / qty / note
let lpT=null;
document.addEventListener('pointerdown',e=>{const it=e.target.closest('.item');if(!it)return;lpT=setTimeout(()=>{longPressed=it;const m=S.menu.find(x=>x.id===it.dataset.id);if(m&&!m.out)itemModal(m,null)},500)});
document.addEventListener('pointermove',e=>{if(Math.abs(e.movementX)+Math.abs(e.movementY)>4)clearTimeout(lpT)});
document.addEventListener('pointerup',()=>{clearTimeout(lpT);setTimeout(()=>longPressed=null,50)});
document.addEventListener('click',e=>{if(longPressed&&e.target.closest('.item')){e.stopImmediatePropagation()}},true);

$('#fileImg').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const max=imgTarget==='qr'?600:320;const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    const url=c.toDataURL('image/jpeg',imgTarget==='qr'?.9:.72);
    if(imgTarget==='qr'){S.settings.qrImage=url;save();setPay()}else{menuDraft.img=url;menuDraft.imgSrc='own';const el=$('#mimg');el.style.backgroundImage=`url('${url}')`;el.textContent=''}};img.src=rd.result};rd.readAsDataURL(f)});
$('#fileJson').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d.settings||!d.menu)throw 0;S=d;saveNow();render();toast('กู้คืนข้อมูลแล้ว')}catch(err){toast('ไฟล์ไม่ถูกต้อง เลือกไฟล์ .json ที่ได้จากปุ่มสำรองข้อมูล')}};rd.readAsText(f)});
window.addEventListener('online',()=>{updateSync();sync(false)});
window.addEventListener('offline',updateSync);
setInterval(()=>{sync(false);if(qrOn()&&!qrT)pollQr();if(view==='tables'&&!$('#modalRoot').innerHTML)renderTables()},60000);

/* PWA offline: register service worker when hosted (GitHub Pages) */
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude\.ai|claudeusercontent|anthropic/.test(location.hostname)){
  try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
}

load();applyTheme();applyScale();render();checkCompat();pollQr();
if(!S.imgTrim){(async()=>{for(const m of S.menu){if(m.img&&/^data:image/.test(m.img)){const t=await shrinkImg(m.img,320);if(t)m.img=t}}S.imgTrim=1;saveNow();if(view==='sell')renderGrid()})()}
setInterval(()=>{if(+S.settings.lockMin>0&&S.session&&Date.now()-lastAct>S.settings.lockMin*60000){S.session=null;actAs=null;closeModal();saveNow();render()}},15000);
})();
</script>

</body>
